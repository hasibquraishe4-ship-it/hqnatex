version: '3.7'
services:
  core-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HQNATEX_DB_NAME}
      POSTGRES_USER: ${HQNATEX_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${HQNATEX_DB_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HQNATEX_DB_ADMIN_USER} -d ${HQNATEX_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - hqnatex_core_pgdata:/var/lib/postgresql/data

  core-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - hqnatex_core_redisdata:/data

volumes:
  hqnatex_core_pgdata:
  hqnatex_core_redisdata:
